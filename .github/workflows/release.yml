name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Trusted publishing (OIDC) butuh npm >= 11.5.1. Node 20 membawa npm 10,
      # jadi upgrade npm khusus untuk publish — tidak mengubah resolusi
      # dependency karena install tetap lewat pnpm.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11

      # Auth npm:
      # - NPM_TOKEN ada  -> dipakai (wajib untuk publish PERTAMA, karena npm
      #   tidak mengizinkan first-publish lewat OIDC).
      # - NPM_TOKEN kosong/secret dihapus -> fallback ke OIDC (id-token: write).
      # Setelah package ada & Trusted Publisher dikonfigurasi di npmjs.com,
      # hapus secret NPM_TOKEN untuk beralih penuh ke OIDC.
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"
            echo "npm auth: NPM_TOKEN"
          else
            echo "npm auth: OIDC trusted publishing"
          fi

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
